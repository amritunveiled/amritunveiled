<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 28" width="1000" height="28" role="img" aria-label="divider" xmlns:c2pa="http://c2pa.org/manifest">
<defs>
  <linearGradient id="l" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#00F5D4" stop-opacity="0"/><stop offset=".25" stop-color="#00F5D4"/>
    <stop offset=".5" stop-color="#9B5DE5"/><stop offset=".75" stop-color="#F15BB5"/>
